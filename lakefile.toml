name = "probe-lean"
version = "0.4.0"
defaultTargets = ["probe-lean"]

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "v4.28.0-rc1"

[[lean_lib]]
name = "ProbeLean"

[[lean_exe]]
name = "probe-lean"
root = "ProbeLean.Main"
supportInterpreter = true

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "tests"
root = "Tests.Main"
supportInterpreter = true
