[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-lean-mcp"
version = "0.1.0"
description = "MCP server that drives probe-lean and answers queries over its extract output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
probe-lean-mcp = "probe_lean_mcp.server:main"

[tool.setuptools]
packages = ["probe_lean_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
