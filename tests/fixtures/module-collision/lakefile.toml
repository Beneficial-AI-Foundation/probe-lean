name = "modcoll"
defaultTargets = ["ModColl"]

# The `collision` fixture under the module system. No root `ModColl.lean`:
# `ModColl.A` and `ModColl.B` both export `public def dup`, so the whole library
# cannot be co-imported, and `extract --module ModColl.Main` imports the closure of
# `ModColl.Main` only. The fixture is also the regression test for the segfault on
# repeated reads of module-system headers in one process, which happened while the
# split olean parts were read with separate `readModuleData` calls.
[[lean_lib]]
name = "ModColl"
globs = ["ModColl.+"]
