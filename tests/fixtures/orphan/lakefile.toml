name = "orph"
defaultTargets = ["Orph"]

# No root `Orph.lean`: `Orph.Dep` and `Orph.Main` are two top-level modules of a
# `globs` library. The CI step deletes `Orph/Dep.lean` after a first `extract`, so
# `Orph.Dep` becomes a stale olean with no source that `Orph.Main` still imports.
# The target build fails on the missing file, so `extract` never imports it.
[[lean_lib]]
name = "Orph"
globs = ["Orph.+"]
