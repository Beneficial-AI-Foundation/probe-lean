name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          test: false

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build-args: tests
          test: false

      - name: Run tests
        run: .lake/build/bin/tests

  check-extract:
    name: Validate extract output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install probe-extract-check
        run: cargo install --git https://github.com/Beneficial-AI-Foundation/probe --bin probe-extract-check

      - name: Run structural checks on example JSON
        run: probe-extract-check examples/lean_Curve25519Dalek_0.1.0.json --allow-warnings
