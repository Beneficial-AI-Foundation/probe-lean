name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          test: false

  # Offline fixture-driven suites for the release tooling. The release build
  # matrix (and with it every published binary) is derived by these scripts, so
  # a broken version policy or pinned-extras entry must fail CI before auto-tag
  # can cut a release from the commit.
  shell-tests:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version-policy tests
        run: bash tests/lean-versions/run.sh

      - name: Installer helper tests
        run: bash tests/test_install_helpers.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build-args: tests
          test: false

      - name: Run tests
        run: .lake/build/bin/tests

      # End-to-end gate for the auxiliary-dependency fold (issue #99). The unit
      # suite exercises the traversal on fabricated graphs and the classifier on
      # the test binary's own environment; only a real `extract` run shows that
      # a recovered edge actually reaches `verification-status`.
      #
      # The fixture is a five-declaration Lake project with no dependencies to
      # fetch, so the step costs one small `lake build`. `AuxFoldCheck.lean`
      # asserts the *precondition* too — that the auxiliary exists and the edge
      # really is hidden behind it — because whether Lean abstracts a proof
      # obligation is elaborator-dependent, and without that assertion the check
      # silently degrades into testing a direct dependency that was never lost.
      #
      # The fixture needs its own `lean-toolchain` (it is a separate Lake
      # project), so the pin is duplicated. The `diff` keeps the copies in step:
      # without it, bumping the root pin would leave this check silently running
      # on the old elaborator — exactly the drift the precondition exists for.
      #
      # The same fixture also carries the sorry-taint end-to-end check
      # (`TaintCheck.lean`): the trusted base, a range-less carrier, a generated
      # companion, fabricated-trust shapes the source scan must not read, the
      # `Divergence(graph):` line on stderr and the `check-axioms` report.
      # `check-status-consistency.py` then asserts the artifact and the report
      # agree in *both* directions on every atom.
      - name: End-to-end aux-fold and sorry-taint extract checks
        run: |
          diff lean-toolchain tests/fixtures/aux-fold/lean-toolchain \
            || { echo "::error::tests/fixtures/aux-fold/lean-toolchain must match the root lean-toolchain"; exit 1; }
          lake build probe-lean
          cd tests/fixtures/aux-fold
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          lake env lean --run AuxFoldCheck.lean
          lake env lean --run TaintCheck.lean extract.stderr check-axioms.out
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

      # The import fallback: two colliding modules force `extract --module` to
      # import the selection only, and the selected module's transitively loaded
      # project dependency carries a `sorry`. P must include that dependency.
      - name: End-to-end import-fallback check
        run: |
          diff lean-toolchain tests/fixtures/collision/lean-toolchain \
            || { echo "::error::tests/fixtures/collision/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/collision
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . -m Coll.Main 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . -m Coll.Main | tee check-axioms.out
          python3 check.py

      # Merged declarations: two modules restate one theorem with the same
      # statement, Lean's importer keeps one proof. The walk must follow both
      # versions' dependencies, so the sorried one taints every caller.
      - name: End-to-end merged-declaration check
        run: |
          diff lean-toolchain tests/fixtures/merge/lean-toolchain \
            || { echo "::error::tests/fixtures/merge/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/merge
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          python3 check.py
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

      # A declaration merged across the project boundary: a project module restates
      # a theorem of a (path) dependency with the same statement and a `sorry`. The
      # olean preflight reads project modules only and cannot see the pair; the
      # importer attributes the name to the dependency and keeps the sorried body.
      # The post-import scan must flag it and taint both callers.
      - name: End-to-end cross-boundary merge check
        run: |
          diff lean-toolchain tests/fixtures/cross-merge/lean-toolchain \
            || { echo "::error::tests/fixtures/cross-merge/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/cross-merge
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          python3 check.py
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

      # The example fixture is real probe-lean output, so any output-format
      # change must be reflected in it. Regenerating and diffing makes staleness
      # a hard failure instead of silent drift (the previous fixture was
      # hand-patched and sat at tool version 0.4.5 for months).
      - name: Verify example fixture is up to date
        run: |
          ./tools/gen-fixture.sh
          if ! git diff --exit-code examples/lean_ExampleProject_0.1.0.json; then
            echo "::error::examples/lean_ExampleProject_0.1.0.json is out of date. Run ./tools/gen-fixture.sh and commit."
            exit 1
          fi

  # The dev toolchain is pinned (lean-toolchain), so the Test job above can never
  # catch a regression that only manifests on a newer Lean — the class that shipped
  # broken release binaries while CI stayed green: the Lean 4.30
  # `ConstantInfo.value?` default change silently emptied every theorem's
  # term-dependencies, and the pinned-toolchain suite could not see it. This job
  # re-runs the whole suite on the newest supported stable toolchain, using the
  # same toolchain-rewrite + Cli-resolve dance as release.yml. Bump LEAN_VERSION
  # when lean-watch reports a new stable line.
  test-newest:
    name: Test (newest supported Lean)
    runs-on: ubuntu-latest
    needs: build
    env:
      LEAN_VERSION: v4.33.0
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite toolchain to newest supported Lean
        run: |
          echo "leanprover/lean4:${LEAN_VERSION}" > lean-toolchain
          # The aux-fold fixture is a separate Lake project with its own pin, and
          # the end-to-end step below asserts the two agree. Rewrite it here so
          # the fixture follows the root instead of silently running this job's
          # check on the pinned elaborator.
          cp lean-toolchain tests/fixtures/aux-fold/lean-toolchain
          cp lean-toolchain tests/fixtures/collision/lean-toolchain
          cp lean-toolchain tests/fixtures/merge/lean-toolchain
          cp lean-toolchain tests/fixtures/cross-merge/lean-toolchain
          # Clear any stale build dir but KEEP lake-manifest.json — lean-action's
          # build precondition needs it; the Cli rev is rewritten below.
          rm -rf .lake

      # Installs the toolchain from lean-toolchain; build happens below after
      # the Cli rev is resolved.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Resolve Cli, pin it, and build tests
        run: |
          cli_rev=$(tools/resolve-cli-rev.sh "${LEAN_VERSION}")
          echo "Using lean4-cli $cli_rev for Lean ${LEAN_VERSION}"
          # Rewrite the rev of ONLY the lean4-cli dependency (same awk as
          # release.yml).
          awk -v ver="$cli_rev" '
            /^[[:space:]]*\[\[/ { incli = 0 }
            /git = ".*lean4-cli"/ { incli = 1 }
            incli && /^[[:space:]]*rev[[:space:]]*=/ { sub(/"v[^"]*"/, "\"" ver "\"") }
            { print }
          ' lakefile.toml > lakefile.toml.tmp && mv lakefile.toml.tmp lakefile.toml
          lake --keep-toolchain update Cli
          # Build the CLI too, not just the test harness: `Tests.Main` does not
          # pull in `ProbeLean.Main`/`Cli`, so the executable can break on a new
          # toolchain while the tests stay green.
          lake build
          lake build tests

      - name: Smoke test
        run: .lake/build/bin/probe-lean --version

      - name: Run tests
        run: .lake/build/bin/tests

      # The reason this job runs the fixture at all: the unit suite's
      # environment-backed checks synthesize auxiliary shapes with `addDecl`, so
      # they pin the classifier but never the *elaborator*. Whether Lean
      # abstracts a proof obligation into a `_proof_N` at all is version
      # dependent, and only a real `extract` run carries that through to
      # `verification-status`. `rm -rf .lake` above cleared the fixture's build
      # dir too, so this is a cold build of five declarations.
      - name: End-to-end aux-fold and sorry-taint extract checks
        run: |
          diff lean-toolchain tests/fixtures/aux-fold/lean-toolchain \
            || { echo "::error::tests/fixtures/aux-fold/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/aux-fold
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          lake env lean --run AuxFoldCheck.lean
          lake env lean --run TaintCheck.lean extract.stderr check-axioms.out
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

      - name: End-to-end import-fallback check
        run: |
          diff lean-toolchain tests/fixtures/collision/lean-toolchain \
            || { echo "::error::tests/fixtures/collision/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/collision
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . -m Coll.Main 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . -m Coll.Main | tee check-axioms.out
          python3 check.py

      # Merged declarations: two modules restate one theorem with the same
      # statement, Lean's importer keeps one proof. The walk must follow both
      # versions' dependencies, so the sorried one taints every caller.
      - name: End-to-end merged-declaration check
        run: |
          diff lean-toolchain tests/fixtures/merge/lean-toolchain \
            || { echo "::error::tests/fixtures/merge/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/merge
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          python3 check.py
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

      # A declaration merged across the project boundary: a project module restates
      # a theorem of a (path) dependency with the same statement and a `sorry`. The
      # olean preflight reads project modules only and cannot see the pair; the
      # importer attributes the name to the dependency and keeps the sorried body.
      # The post-import scan must flag it and taint both callers.
      - name: End-to-end cross-boundary merge check
        run: |
          diff lean-toolchain tests/fixtures/cross-merge/lean-toolchain \
            || { echo "::error::tests/fixtures/cross-merge/lean-toolchain must match the root lean-toolchain"; exit 1; }
          cd tests/fixtures/cross-merge
          lake build
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" extract . 2>extract.stderr || {
            status=$?; cat extract.stderr >&2; exit "$status"; }
          cat extract.stderr >&2
          "$GITHUB_WORKSPACE/.lake/build/bin/probe-lean" check-axioms . | tee check-axioms.out
          python3 check.py
          python3 "$GITHUB_WORKSPACE/tools/audit/check-status-consistency.py" .verilib/probes/lean_*.json check-axioms.out

  check-version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Version.lean matches lakefile.toml
        run: |
          ./tools/gen-version.sh
          if ! git diff --exit-code ProbeLean/Version.lean; then
            echo "::error::ProbeLean/Version.lean is out of date. Run ./tools/gen-version.sh and commit."
            exit 1
          fi

  check-extract:
    name: Validate extract output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install probe-extract-check
        run: cargo install --git https://github.com/Beneficial-AI-Foundation/probe probe-extract-check

      # No --allow-warnings: the old fixture needed it (4 warnings, including
      # overlapping source locations from real generated declarations), but the
      # generated fixture is warning-free, so the check can be strict.
      - name: Run structural checks on example JSON
        run: probe-extract-check examples/lean_ExampleProject_0.1.0.json

  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-latest
    needs: [build, test, test-newest, check-version, check-extract, shell-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version and create tag if missing
        run: |
          VERSION=$(grep '^version' lakefile.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi
