name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          test: false

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build-args: tests
          test: false

      - name: Run tests
        run: .lake/build/bin/tests

  check-version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Version.lean matches lakefile.toml
        run: |
          ./tools/gen-version.sh
          if ! git diff --exit-code ProbeLean/Version.lean; then
            echo "::error::ProbeLean/Version.lean is out of date. Run ./tools/gen-version.sh and commit."
            exit 1
          fi

  check-extract:
    name: Validate extract output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install probe-extract-check
        run: cargo install --git https://github.com/Beneficial-AI-Foundation/probe probe-extract-check

      - name: Run structural checks on example JSON
        run: probe-extract-check examples/lean_Curve25519Dalek_0.1.0.json --allow-warnings

  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-latest
    needs: [build, test, check-version, check-extract]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version and create tag if missing
        run: |
          VERSION=$(grep '^version' lakefile.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi
