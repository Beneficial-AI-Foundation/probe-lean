# BAIF Lean Extract Action
# Analyzes a Lean 4 project and produces verification results JSON.
#
# Usage:
#   - uses: Beneficial-AI-Foundation/probe-lean/action@main
#     with:
#       project-path: .

name: 'BAIF Lean Extract'
description: 'Analyze a Lean 4 project: extract atoms, detect sorries, compute specs'
author: 'Beneficial AI Foundation'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  project-path:
    description: 'Path to the Lean 4 project (directory containing lakefile.toml or lakefile.lean)'
    required: true
  lean-version:
    description: 'Lean version override (default: auto-detect from project lean-toolchain)'
    required: false
    default: ''
  extract-args:
    description: 'Extra arguments passed to probe-lean extract (e.g., --skip-verify --skip-enrich --library Lib1)'
    required: false
    default: ''
  output-dir:
    description: 'Directory for output files (default: current directory)'
    required: false
    default: '.'
  probe-lean-ref:
    description: >
      Git ref of probe-lean whose installer (tools/bash/install.sh) is used to
      fetch the binary, and whose source is used if a binary build is needed
      (default: main).
    required: false
    default: 'main'

outputs:
  results-file:
    description: 'Path to the extract results JSON file'
    value: ${{ steps.extract.outputs.results_file }}
  lean-version:
    description: 'Lean version used'
    value: ${{ steps.detect.outputs.lean_version }}
  atom-count:
    description: 'Number of atoms extracted'
    value: ${{ steps.extract.outputs.atom_count }}

runs:
  using: 'composite'
  steps:
    - name: Detect Lean version
      id: detect
      shell: bash
      run: |
        PROJECT_PATH="${{ inputs.project-path }}"
        TOOLCHAIN_FILE="$PROJECT_PATH/lean-toolchain"

        if [ ! -f "$TOOLCHAIN_FILE" ]; then
          echo "::error::lean-toolchain not found at $TOOLCHAIN_FILE"
          exit 1
        fi

        LEAN_VERSION="${{ inputs.lean-version }}"
        if [ -z "$LEAN_VERSION" ]; then
          CONTENTS=$(cat "$TOOLCHAIN_FILE" | tr -d '[:space:]')
          LEAN_VERSION="${CONTENTS##*:}"
          echo "Auto-detected Lean version: $LEAN_VERSION"
        fi

        echo "lean_version=$LEAN_VERSION" >> $GITHUB_OUTPUT

    # Install probe-lean via the maintained installer, which downloads the
    # pre-built release binary matching the project's Lean version and only
    # falls back to a source build when no matching asset exists.  This avoids
    # cloning + `lake build probe-lean`, and avoids re-installing the Lean
    # toolchain (the old `elan toolchain install` step failed with "already
    # installed" when this action ran after leanprover/lean-action).
    - name: Install probe-lean
      shell: bash
      run: |
        LEAN_VERSION="${{ steps.detect.outputs.lean_version }}"
        REF="${{ inputs.probe-lean-ref }}"
        echo "Installing probe-lean for Lean $LEAN_VERSION (installer ref: $REF)..."
        curl -sSfL "https://raw.githubusercontent.com/Beneficial-AI-Foundation/probe-lean/${REF}/tools/bash/install.sh" \
          | bash -s -- --lean-version "$LEAN_VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Download Mathlib cache if needed
      shell: bash
      run: |
        PROJECT_PATH="${{ inputs.project-path }}"
        if [ -f "$PROJECT_PATH/lake-manifest.json" ]; then
          if grep -q '"mathlib"' "$PROJECT_PATH/lake-manifest.json" 2>/dev/null; then
            echo "Mathlib dependency detected, downloading cache..."
            cd "$PROJECT_PATH" && lake exe cache get || echo "::warning::Mathlib cache download failed"
          fi
        fi

    - name: Run probe-lean extract
      id: extract
      shell: bash
      run: |
        PROJECT_PATH="${{ inputs.project-path }}"
        OUTPUT_DIR="${{ inputs.output-dir }}"
        EXTRACT_ARGS="${{ inputs.extract-args }}"

        echo "=== Running probe-lean extract ==="
        echo "Project: $PROJECT_PATH"

        echo "Running: probe-lean extract $PROJECT_PATH $EXTRACT_ARGS"
        # shellcheck disable=SC2086 -- EXTRACT_ARGS is intentionally word-split
        probe-lean extract "$PROJECT_PATH" $EXTRACT_ARGS

        # Find the output file
        RESULTS_FILE=$(find "$PROJECT_PATH/.verilib/probes/" -name "lean_*.json" -type f 2>/dev/null | head -1)
        if [ -z "$RESULTS_FILE" ]; then
          echo "::warning::No output file found in $PROJECT_PATH/.verilib/probes/"
          RESULTS_FILE=""
          ATOM_COUNT=0
        else
          ATOM_COUNT=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(len(d.get('data',{})))" 2>/dev/null || echo 0)
          echo "Results: $RESULTS_FILE ($ATOM_COUNT atoms)"

          if [ -n "$OUTPUT_DIR" ] && [ "$OUTPUT_DIR" != "." ]; then
            mkdir -p "$OUTPUT_DIR"
            cp "$RESULTS_FILE" "$OUTPUT_DIR/"
            RESULTS_FILE="$OUTPUT_DIR/$(basename "$RESULTS_FILE")"
          fi
        fi

        echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT
        echo "atom_count=$ATOM_COUNT" >> $GITHUB_OUTPUT
